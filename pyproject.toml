[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "username-recon"
version = "0.1.0"
description = "Lightweight toolkit for username reconnaissance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "click>=8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0"
]

[project.scripts]
recon = "username_recon.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=username_recon"
